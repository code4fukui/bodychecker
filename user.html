<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BodyChecker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #176b87;
      --ok: #16835f;
      --warn: #b26a00;
      --bad: #b42318;
      --shadow: 0 12px 30px rgba(23, 32, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .records {
      max-height: 72vh;
      overflow: auto;
    }

    .day {
      border-bottom: 1px solid var(--line);
    }

    .day-title {
      padding: 10px 12px;
      background: #f9fafb;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .record {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-top: 1px solid var(--line);
      background: white;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .record.active,
    .record:hover {
      background: #eef7f8;
    }

    .record strong,
    .record span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record span {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .record em {
      align-self: center;
      color: var(--accent);
      font-style: normal;
      font-weight: 720;
      white-space: nowrap;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .metric {
      min-height: 96px;
      padding: 13px;
      background: white;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .value {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-top: 7px;
      font-size: 27px;
      font-weight: 720;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .value .value-good {
      color: var(--ok);
    }

    .value .value-good::after {
      content: " 🙂";
    }

    .value .value-best {
      color: var(--ok);
    }

    .value .value-best::after {
      content: " 🏆";
    }

    .value .value-bad {
      color: var(--bad);
    }

    .value .value-bad::after {
      content: " 😞";
    }

    .value .value-warn {
      color: var(--warn);
    }

    #wholeBodyPhaseAngle50kHz.value-good::after,
    #wholeBodyPhaseAngle50kHz.value-bad::after,
    #bodyFatPercent.value-good::after,
    #bodyFatPercent.value-bad::after,
    #weightKg.value-good::after,
    #weightKg.value-bad::after,
    #muscleMassKg.value-good::after,
    #muscleMassKg.value-bad::after,
    #muscleMassKg.value-best::after {
      content: "";
    }

    #wholeBodyPhaseAngle50kHz.value-good + .unit::after,
    #bodyFatPercent.value-good + .unit::after,
    #weightKg.value-good + .unit::after,
    #muscleMassKg.value-good + .unit::after {
      content: " 🙂";
      color: var(--ok);
      font-size: 27px;
      font-weight: 720;
    }

    #wholeBodyPhaseAngle50kHz.value-bad + .unit::after,
    #bodyFatPercent.value-bad + .unit::after,
    #weightKg.value-bad + .unit::after,
    #muscleMassKg.value-bad + .unit::after {
      content: " 😞";
      color: var(--bad);
      font-size: 27px;
      font-weight: 720;
    }

    #muscleMassKg.value-best + .unit::after {
      content: " 🏆";
      color: var(--ok);
      font-size: 27px;
      font-weight: 720;
    }

    .unit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .diff {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      min-height: 22px;
    }

    .diff span {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f9fafb;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .diff .delta {
      border-color: #b7d3dc;
      background: #eef7f8;
      color: var(--accent);
      font-weight: 650;
    }

    .diff .good {
      border-color: #badbcc;
      background: #edf7f2;
      color: var(--ok);
      font-weight: 650;
    }

    .diff .warn {
      border-color: #f1c6c2;
      background: #fff1f0;
      color: var(--bad);
      font-weight: 650;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .segment {
      min-height: 94px;
      padding: 12px;
      background: white;
    }

    .segment h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .kv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .kv span:nth-child(odd) {
      color: var(--muted);
    }

    .balance-warn {
      color: var(--warn);
      font-weight: 720;
    }

    .balance-bad {
      color: var(--bad);
      font-weight: 720;
    }

    .score-map {
      position: relative;
      min-height: 300px;
      margin: 12px 0;
      border: 1px solid var(--line);
      background: white;
      overflow: hidden;
    }

    .score-grid {
      position: absolute;
      inset: 32px 30px 40px 48px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      border-left: 2px solid #98a2b3;
      border-bottom: 2px solid #98a2b3;
      background: #f9fafb;
    }

    .score-cell {
      display: grid;
      place-items: center;
      padding: 7px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
    }

    .score-cell.standard {
      color: var(--text);
      font-weight: 700;
    }

    .score-points {
      position: absolute;
      inset: 32px 30px 40px 48px;
    }

    .score-point {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 23px;
      padding: 0 6px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: white;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      transform: translate(-50%, -50%);
      box-shadow: 0 3px 8px rgba(23, 32, 42, 0.12);
      white-space: nowrap;
    }

    .score-point.average {
      z-index: 3;
    }

    .score-axis-x,
    .score-axis-y {
      position: absolute;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
    }

    .score-axis-x {
      right: 30px;
      bottom: 13px;
    }

    .score-axis-y {
      top: 11px;
      left: 13px;
    }

    .score-empty {
      position: absolute;
      inset: 32px 30px 40px 48px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 30px 14px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .records {
        max-height: 320px;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .segments {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .app {
        padding: 14px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics,
      .segments {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>BodyChecker</h1>
      <span class="pill">記録 <strong id="count">0</strong></span>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="panel-head">
          <h2>日付別記録</h2>
          <span id="message" class="pill">--</span>
        </div>
        <div id="records" class="records">
          <div class="empty">記録がありません</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>測定値</h2>
          <span id="measuredAt" class="pill">--</span>
        </div>
        <div class="panel-head">
          <h2>体型判定マップ</h2>
          <span class="pill">筋肉量 / 体脂肪率</span>
        </div>
        <div id="scoreMap" class="score-map"></div>
        <div class="metrics">
          <div class="metric"><div class="label">体重</div><div class="value"><span id="weightKg">--</span><span class="unit">kg</span></div><div id="weightDiff" class="diff"></div></div>
          <div class="metric"><div class="label">基礎代謝量</div><div class="value"><span id="basalMetabolicRateKcal">--</span><span class="unit">kcal</span></div></div>
          <div class="metric"><div class="label">四肢筋肉量合計(ASM)</div><div class="value"><span id="asm">--</span><span class="unit">kg</span></div></div>
          <div class="metric"><div class="label">BMI</div><div class="value"><span id="bmi">--</span></div><div id="bmiDiff" class="diff"></div></div>
          <div class="metric"><div class="label">内臓脂肪レベル</div><div class="value"><span id="visceralFatLevel">--</span></div><div id="visceralDiff" class="diff"></div></div>
          <div class="metric"><div class="label">体脂肪率</div><div class="value"><span id="bodyFatPercent">--</span><span class="unit">%</span></div><div id="bodyFatDiff" class="diff"></div></div>
          <div class="metric"><div class="label">筋肉量</div><div class="value"><span id="muscleMassKg">--</span><span class="unit">kg</span></div><div id="muscleDiff" class="diff"></div></div>
          <div class="metric"><div class="label">脂肪量</div><div class="value"><span id="fatMassKg">--</span><span class="unit">kg</span></div></div>
          <div class="metric"><div class="label">SMI</div><div class="value"><span id="smi">--</span></div><div id="smiDiff" class="diff"></div></div>
          <div class="metric"><div class="label">位相角（全身・50kHz）</div><div class="value"><span id="wholeBodyPhaseAngle50kHz">--</span><span class="unit">°</span></div></div>
          <div class="metric"><div class="label">腕筋肉バランス</div><div class="value"><span id="armMuscleBalance">--</span></div></div>
          <div class="metric"><div class="label">足筋肉バランス</div><div class="value"><span id="legMuscleBalance">--</span></div></div>
        </div>
        <div class="panel-head">
          <h2>部位別</h2>
          <span class="pill">脂肪率 / 筋肉量 / 位相角</span>
        </div>
        <div id="segments" class="segments"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { CSV } from "https://code4fukui.github.io/CSV/CSV.js";

    const STORAGE_KEY = "bodychecker-user-records";
    const SEX_LABELS = { male: "男性", female: "女性" };
    const FAT_STANDARD_COLUMNS = {
      ageGroup: "年代",
      sex: "性別",
      lower: "体脂肪率（標準下限）",
      upper: "体脂肪率（標準上限）",
    };
    const MUSCLE_STANDARD_COLUMNS = {
      ageGroup: "年代",
      sex: "性別",
      lower: "筋肉量下限(kg)",
      upper: "筋肉量上限(kg)",
    };
    const SEGMENTS = [
      ["trunk", "体幹部"],
      ["rightArm", "右腕"],
      ["leftArm", "左腕"],
      ["rightLeg", "右足"],
      ["leftLeg", "左足"],
    ];
    const SCORE_POINTS = [
      ["trunk", "体幹"],
      ["rightArm", "右腕"],
      ["leftArm", "左腕"],
      ["rightLeg", "右足"],
      ["leftLeg", "左足"],
    ];
    const SCORE_MAP_LABELS = [
      ["かくれ肥満", "肥満型", "かた太り"],
      ["運動不足", "標準", "筋肉質"],
      ["やせ型", "細身筋肉質", "筋肉質"],
    ];
    const els = Object.fromEntries([
      "count", "message", "records", "measuredAt", "weightKg", "bodyFatPercent",
      "muscleMassKg", "fatMassKg", "bmi", "visceralFatLevel", "smi",
      "basalMetabolicRateKcal", "asm", "weightDiff", "bodyFatDiff", "muscleDiff", "bmiDiff",
      "wholeBodyPhaseAngle50kHz", "armMuscleBalance", "legMuscleBalance", "visceralDiff", "smiDiff", "scoreMap", "segments",
    ].map((id) => [id, document.getElementById(id)]));
    let selectedKey = null;
    let fatStandards = [];
    let muscleStandards = [];

    async function loadFatStandards() {
      try {
        fatStandards = (await CSV.fetchJSON("fat.csv")).map((row) => ({
          ageGroup: row[FAT_STANDARD_COLUMNS.ageGroup],
          sex: row[FAT_STANDARD_COLUMNS.sex],
          lower: Number(row[FAT_STANDARD_COLUMNS.lower]),
          upper: Number(row[FAT_STANDARD_COLUMNS.upper]),
        })).filter((row) => row.ageGroup && row.sex && Number.isFinite(row.lower) && Number.isFinite(row.upper));
      } catch (error) {
        console.error(error);
        fatStandards = [];
      }
    }

    async function loadMuscleStandards() {
      try {
        muscleStandards = (await CSV.fetchJSON("muscle.csv")).map((row) => ({
          ageGroup: row[MUSCLE_STANDARD_COLUMNS.ageGroup],
          sex: row[MUSCLE_STANDARD_COLUMNS.sex],
          lower: Number(row[MUSCLE_STANDARD_COLUMNS.lower]),
          upper: Number(row[MUSCLE_STANDARD_COLUMNS.upper]),
        })).filter((row) => row.ageGroup && row.sex && Number.isFinite(row.lower) && Number.isFinite(row.upper));
      } catch (error) {
        console.error(error);
        muscleStandards = [];
      }
    }


    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function decodePayload(text) {
      const normalized = text.replace(/^data=/, "").replaceAll("-", "+").replaceAll("_", "/");
      const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function recordKey(record) {
      return [record.measuredAt, record.id, record.weightKg, record.bodyFatPercent].join("|");
    }

    function recordDate(record) {
      const source = record.measuredAt || record.savedAt || new Date().toISOString();
      return String(source).slice(0, 10);
    }

    function formatValue(value) {
      if (value == null || value === "") return "--";
      if (typeof value === "number") return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      return String(value);
    }

    function formatAge(value) {
      const formatted = formatValue(value);
      return formatted === "--" ? formatted : `${formatted}歳`;
    }

    function formatDecimal(value, digits = 1) {
      if (value == null || value === "") return "--";
      if (typeof value !== "number") return String(value);
      return value.toFixed(digits);
    }

    function formatPhaseAngle(value) {
      return typeof value === "number" ? formatDecimal(Math.abs(value)) : formatValue(value);
    }

    function formatWeightRatio(value, weightKg) {
      if (value == null || weightKg == null || weightKg <= 0) return "--";
      return `${(value / weightKg * 100).toFixed(1)}%`;
    }

    function muscleBalance(record, pair) {
      const [right, left] = pair.map((side) => record[`${side}MuscleMassKg`]);
      if (right == null || left == null || right <= 0 || left <= 0) return "";
      if (right === left) return { className: "value-good", label: "0%" };
      const largerSide = right > left ? "右" : "左";
      const larger = Math.max(right, left);
      const smaller = Math.min(right, left);
      const diff = (larger - smaller) / larger * 100;
      const className = diff >= 10 ? "balance-bad" : diff >= 5 ? "balance-warn" : "value-good";
      return { className, label: `${largerSide}${diff.toFixed(1)}%` };
    }

    function setMuscleBalance(id, record, pair) {
      const balance = muscleBalance(record, pair);
      const target = els[id];
      target.classList.remove("value-good", "balance-warn", "balance-bad");
      if (!balance) {
        target.textContent = "--";
        return;
      }
      target.textContent = balance.label;
      if (balance.className) target.classList.add(balance.className);
    }

    function signedValue(value, unit = "") {
      if (value == null || Number.isNaN(value)) return "--";
      const rounded = value.toFixed(1);
      const sign = Number(rounded) > 0 ? "+" : "";
      return `${sign}${rounded}${unit}`;
    }

    function setText(id, value, mapper) {
      els[id].textContent = mapper ? mapper(value) : formatValue(value);
    }

    function setValueStatus(id, good) {
      const target = els[id];
      target.classList.remove("value-good", "value-best", "value-bad", "value-warn");
      if (good == null) return;
      target.classList.add(good ? "value-good" : "value-bad");
    }

    function setValueStatusClass(id, status) {
      const target = els[id];
      target.classList.remove("value-good", "value-best", "value-bad", "value-warn");
      if (status) target.classList.add(`value-${status}`);
    }

    function setComparedValueStatus(id, current, baseline, higherIsGood) {
      if (current == null || baseline == null) {
        setValueStatus(id, null);
        return;
      }
      setValueStatus(id, higherIsGood ? current >= baseline : current <= baseline);
    }

    function ageGroupLabel(age) {
      const value = Number(age);
      if (!Number.isFinite(value)) return null;
      const decade = Math.floor(value / 10) * 10;
      return decade >= 20 && decade <= 60 ? `${decade}代` : null;
    }

    function findFatStandard({ age, sex }) {
      const ageGroup = ageGroupLabel(age);
      const sexLabel = SEX_LABELS[sex];
      if (!ageGroup || !sexLabel) return null;
      return fatStandards.find((standard) => standard.ageGroup === ageGroup && standard.sex === sexLabel) ?? null;
    }

    function findMuscleStandard({ age, sex }) {
      const ageGroup = ageGroupLabel(age);
      const sexLabel = SEX_LABELS[sex];
      if (!ageGroup || !sexLabel) return null;
      return muscleStandards.find((standard) => standard.ageGroup === ageGroup && standard.sex === sexLabel) ?? null;
    }

    function setBodyFatStandard(record) {
      const target = els.bodyFatDiff;
      target.textContent = "";
      const standard = findFatStandard(record);
      const bodyFatPercent = record.bodyFatPercent;
      if (!standard || bodyFatPercent == null) {
        setValueStatusClass("bodyFatPercent", null);
        return;
      }
      const base = document.createElement("span");
      base.textContent = `標準範囲 ${formatValue(standard.lower)}-${formatValue(standard.upper)}%`;
      target.append(base);
      if (bodyFatPercent <= standard.lower) {
        setValueStatusClass("bodyFatPercent", "good");
      } else if (bodyFatPercent > standard.upper) {
        setValueStatusClass("bodyFatPercent", "bad");
      } else {
        setValueStatusClass("bodyFatPercent", null);
      }
    }

    function setRangeStandard({ targetId, valueId, standard, value }) {
      const target = els[targetId];
      target.textContent = "";
      if (!standard || value == null) {
        setValueStatusClass(valueId, null);
        return;
      }
      const base = document.createElement("span");
      base.textContent = `標準範囲 ${formatValue(standard.lower)}-${formatValue(standard.upper)}kg`;
      target.append(base);
      if (value < standard.lower) {
        setValueStatusClass(valueId, "bad");
      } else if (value > standard.upper) {
        setValueStatusClass(valueId, "best");
      } else {
        setValueStatusClass(valueId, "good");
      }
    }

    function setMuscleStandard(record) {
      setRangeStandard({
        targetId: "muscleDiff",
        valueId: "muscleMassKg",
        standard: findMuscleStandard(record),
        value: record.muscleMassKg,
      });
    }

    function bmiStatus(value) {
      if (typeof value !== "number") return null;
      if (value < 18.5) return "warn";
      if (value < 25) return "good";
      if (value < 30) return "warn";
      return "bad";
    }

    function setBMIDiff(value) {
      const target = els.bmiDiff;
      target.textContent = "";
      if (typeof value !== "number") return;
      const base = document.createElement("span");
      base.textContent = "基準 18.5-25未満";
      const status = document.createElement("span");
      const bmiClass = bmiStatus(value);
      status.className = bmiClass === "bad" ? "warn" : bmiClass === "good" ? "good" : "";
      status.textContent = value < 18.5 ? "やせ" : value < 25 ? "標準" : value < 30 ? "肥満1度" : "肥満2度以上";
      target.append(base, status);
    }

    function phaseAngleStatus(value, sex) {
      if (typeof value !== "number") return null;
      const phaseAngle = Math.abs(value);
      if (sex === "male") {
        if (phaseAngle < 4.1) return "bad";
        if (phaseAngle < 5) return "warn";
        if (phaseAngle >= 6) return "good";
        return null;
      }
      if (sex === "female") {
        if (phaseAngle < 4.1) return "bad";
        if (phaseAngle < 4.5) return "warn";
        if (phaseAngle >= 5.5) return "good";
      }
      return null;
    }

    function setDiff(id, current, baseline, unit = "") {
      const target = els[id];
      target.textContent = "";
      if (current == null || baseline == null) return;
      const base = document.createElement("span");
      const delta = document.createElement("span");
      base.textContent = `基準 ${formatDecimal(baseline)}${unit}`;
      delta.className = "delta";
      delta.textContent = `差分 ${signedValue(current - baseline, unit)}`;
      target.append(base, delta);
    }

    function setRangeDiff(id, current, baseline, label, status, delta = current - baseline) {
      const target = els[id];
      target.textContent = "";
      if (current == null || baseline == null) return;
      const base = document.createElement("span");
      const diff = document.createElement("span");
      base.textContent = `${label} ${formatValue(baseline)}`;
      diff.className = "delta";
      diff.textContent = `差分 ${signedValue(delta)}`;
      target.append(base, diff);
      if (status) {
        const badge = document.createElement("span");
        badge.className = status.good ? "good" : "warn";
        badge.textContent = status.label;
        target.append(badge);
      }
    }

    function clampScore(value) {
      return Math.min(4, Math.max(-4, value));
    }

    function scoreAverage(record) {
      let fatTotal = 0;
      let muscleTotal = 0;
      let count = 0;
      for (const [segment] of SCORE_POINTS) {
        const fatScore = record[`${segment}BodyFatScore`];
        const muscleScore = record[`${segment}MuscleScore`];
        if (typeof fatScore !== "number" || typeof muscleScore !== "number") continue;
        fatTotal += fatScore;
        muscleTotal += muscleScore;
        count++;
      }
      if (!count) return null;
      return {
        fatScore: fatTotal / count,
        muscleScore: muscleTotal / count,
      };
    }

    function appendScorePoint(points, label, fatScore, muscleScore, className = "") {
      const point = document.createElement("span");
      point.className = `score-point${className ? ` ${className}` : ""}`;
      point.textContent = label;
      point.title = `${label}: 筋肉量判定 ${formatDecimal(muscleScore, 1)}, 体脂肪率判定 ${formatDecimal(fatScore, 1)}`;
      point.style.left = `${(clampScore(muscleScore) + 4) / 8 * 100}%`;
      point.style.top = `${(4 - clampScore(fatScore)) / 8 * 100}%`;
      points.append(point);
    }

    function renderScoreMap(record) {
      els.scoreMap.textContent = "";
      const grid = document.createElement("div");
      grid.className = "score-grid";
      for (const row of SCORE_MAP_LABELS) {
        for (const label of row) {
          const cell = document.createElement("div");
          cell.className = `score-cell${label === "標準" ? " standard" : ""}`;
          cell.textContent = label;
          grid.append(cell);
        }
      }
      const points = document.createElement("div");
      points.className = "score-points";
      let count = 0;
      const average = scoreAverage(record);
      if (average) appendScorePoint(points, "平均", average.fatScore, average.muscleScore, "average");
      for (const [segment, label] of SCORE_POINTS) {
        const fatScore = record[`${segment}BodyFatScore`];
        const muscleScore = record[`${segment}MuscleScore`];
        if (typeof fatScore !== "number" || typeof muscleScore !== "number") continue;
        appendScorePoint(points, label, fatScore, muscleScore);
        count++;
      }
      const axisX = document.createElement("div");
      axisX.className = "score-axis-x";
      axisX.textContent = "筋肉量判定 →";
      const axisY = document.createElement("div");
      axisY.className = "score-axis-y";
      axisY.textContent = "↑ 体脂肪率判定";
      els.scoreMap.append(grid, points, axisX, axisY);
      if (!count) {
        const empty = document.createElement("div");
        empty.className = "score-empty";
        empty.textContent = "スコアがありません";
        els.scoreMap.append(empty);
      }
    }

    function renderSegments(record) {
      els.segments.textContent = "";
      const average = scoreAverage(record);
      if (average) {
        const div = document.createElement("div");
        div.className = "segment";
        div.innerHTML = `
          <h3>平均</h3>
          <div class="kv">
            <span>脂肪スコア</span><strong>${formatDecimal(average.fatScore)}</strong>
            <span>筋肉スコア</span><strong>${formatDecimal(average.muscleScore)}</strong>
          </div>
        `;
        els.segments.append(div);
      }
      for (const [segment, label] of SEGMENTS) {
        const div = document.createElement("div");
        div.className = "segment";
        div.innerHTML = `
          <h3>${label}</h3>
          <div class="kv">
            <span>脂肪率</span><strong>${formatDecimal(record[`${segment}BodyFatPercent`])}%</strong>
            <span>筋肉量</span><strong>${formatDecimal(record[`${segment}MuscleMassKg`])} kg</strong>
            <span>筋肉量体重比</span><strong>${formatWeightRatio(record[`${segment}MuscleMassKg`], record.weightKg)}</strong>
            <span>脂肪スコア</span><strong>${formatDecimal(record[`${segment}BodyFatScore`])}</strong>
            <span>筋肉スコア</span><strong>${formatDecimal(record[`${segment}MuscleScore`])}</strong>
            ${segment === "trunk" ? "" : `<span>位相角（50kHz）</span><strong>${formatPhaseAngle(record[`${segment}PhaseAngle50kHz`])}°</strong>`}
          </div>
        `;
        els.segments.append(div);
      }
    }

    function renderDetail(record) {
      if (!record) return;
      selectedKey = recordKey(record);
      els.measuredAt.textContent = record.measuredAt ? record.measuredAt.replace("T", " ") : "--";
      setText("weightKg", record.weightKg, formatDecimal);
      setText("bodyFatPercent", record.bodyFatPercent, formatDecimal);
      setText("muscleMassKg", record.muscleMassKg, formatDecimal);
      setText("fatMassKg", record.fatMassKg, formatDecimal);
      setText("bmi", record.bmi, formatDecimal);
      setValueStatusClass("bmi", bmiStatus(record.bmi));
      setBMIDiff(record.bmi);
      setText("visceralFatLevel", record.visceralFatLevel);
      setText("basalMetabolicRateKcal", record.basalMetabolicRateKcal);
      setText("asm", record.appendicularSkeletalMuscleMassKg, formatDecimal);
      setText("smi", record.appendicularSkeletalMuscleMassHeightSquared, (value) => formatDecimal(value, 2));
      els.wholeBodyPhaseAngle50kHz.textContent = formatPhaseAngle(record.wholeBodyPhaseAngle50kHz);
      setValueStatusClass("wholeBodyPhaseAngle50kHz", phaseAngleStatus(record.wholeBodyPhaseAngle50kHz, record.sex));
      setMuscleBalance("armMuscleBalance", record, ["rightArm", "leftArm"]);
      setMuscleBalance("legMuscleBalance", record, ["rightLeg", "leftLeg"]);
      setDiff("weightDiff", record.weightKg, record.standardWeightKg, "kg");
      setBodyFatStandard(record);
      setMuscleStandard(record);
      setComparedValueStatus("weightKg", record.weightKg, record.standardWeightKg, false);
      const visceralStatus = record.visceralFatLevel == null ? null : {
        good: record.visceralFatLevel <= 12,
        label: record.visceralFatLevel <= 12 ? "範囲内" : "高め",
      };
      setValueStatus("visceralFatLevel", visceralStatus?.good ?? null);
      setRangeDiff("visceralDiff", record.visceralFatLevel, 12, "健康範囲上限", visceralStatus);
      const smi = record.appendicularSkeletalMuscleMassHeightSquared;
      const smiBase = record.sex === "male" ? 7.0 : record.sex === "female" ? 5.7 : null;
      const smiStatus = smi == null || smiBase == null ? null : {
        good: smi >= smiBase,
        label: smi >= smiBase ? "目安以上" : "低め",
      };
      setValueStatus("smi", smiStatus?.good ?? null);
      setRangeDiff("smiDiff", smi, smiBase, "低筋量目安", smiStatus, smi == null || smiBase == null ? null : smi - smiBase);
      renderScoreMap(record);
      renderSegments(record);
      renderList(loadRecords());
    }

    function renderList(records) {
      els.count.textContent = String(records.length);
      els.records.textContent = "";
      if (!records.length) {
        els.records.innerHTML = '<div class="empty">記録がありません</div>';
        return;
      }
      const grouped = new Map();
      for (const record of records) {
        const date = recordDate(record);
        if (!grouped.has(date)) grouped.set(date, []);
        grouped.get(date).push(record);
      }
      for (const date of [...grouped.keys()].sort().reverse()) {
        const section = document.createElement("section");
        section.className = "day";
        const title = document.createElement("div");
        title.className = "day-title";
        title.textContent = date;
        section.append(title);
        for (const record of grouped.get(date).sort((a, b) => String(b.measuredAt || b.savedAt).localeCompare(String(a.measuredAt || a.savedAt)))) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `record${recordKey(record) === selectedKey ? " active" : ""}`;
          const main = document.createElement("span");
          const titleNode = document.createElement("strong");
          const sub = document.createElement("span");
          const value = document.createElement("em");
          titleNode.textContent = record.measuredAt ? record.measuredAt.replace("T", " ") : date;
          sub.textContent = record.age != null ? `年齢 ${formatAge(record.age)}` : "年齢 --";
          value.textContent = `${formatDecimal(record.weightKg)} kg`;
          main.append(titleNode, sub);
          button.append(main, value);
          button.addEventListener("click", () => renderDetail(record));
          section.append(button);
        }
        els.records.append(section);
      }
    }

    function addPayloadFromURL() {
      const query = location.search.slice(1);
      if (!query) return null;
      const record = decodePayload(decodeURIComponent(query));
      const records = loadRecords();
      const key = recordKey(record);
      const exists = records.some((item) => recordKey(item) === key);
      if (!exists) {
        records.push(record);
        saveRecords(records);
        els.message.textContent = "追加しました";
      } else {
        els.message.textContent = "登録済み";
      }
      return record;
    }

    let initial = null;
    try {
      initial = addPayloadFromURL();
    } catch (error) {
      els.message.textContent = "読込エラー";
      console.error(error);
    }
    await Promise.all([loadFatStandards(), loadMuscleStandards()]);
    const records = loadRecords();
    renderList(records);
    renderDetail(initial || records.at(-1));
  </script>
</body>
</html>
